
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天北部去哪玩？抽籤器</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: "Microsoft JhengHei", sans-serif;
        background: linear-gradient(135deg, #dff6ff, #fff1e6);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 520px;
        background: white;
        padding: 35px;
        border-radius: 24px;
        box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        text-align: center;
    }

    h1 {
        color: #2878a5;
        font-size: 28px;
        margin-bottom: 10px;
    }

    .subtitle {
        color: #777;
        margin-bottom: 25px;
    }

    label {
        display: block;
        text-align: left;
        font-weight: bold;
        color: #444;
        margin-bottom: 10px;
    }

    textarea {
        width: 100%;
        height: 160px;
        padding: 15px;
        border: 2px solid #d5eaf2;
        border-radius: 12px;
        font-size: 16px;
        line-height: 1.8;
        resize: vertical;
        outline: none;
    }

    textarea:focus {
        border-color: #48a9d6;
    }

    button {
        width: 100%;
        margin-top: 20px;
        padding: 16px;
        border: none;
        border-radius: 12px;
        background: #329acb;
        color: white;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #237ca8;
        transform: translateY(-2px);
    }

    button:active {
        transform: scale(0.98);
    }

    .result-box {
        margin-top: 25px;
        padding: 25px 15px;
        background: #f0f9ff;
        border: 2px dashed #83c7e6;
        border-radius: 15px;
        min-height: 120px;
    }

    .result-title {
        color: #777;
        font-size: 15px;
        margin-bottom: 12px;
    }

    #result {
        color: #e47b36;
        font-size: 30px;
        font-weight: bold;
        word-break: break-word;
    }

    #message {
        color: #e05252;
        margin-top: 10px;
        font-size: 15px;
    }

    .footer {
        margin-top: 20px;
        color: #999;
        font-size: 13px;
    }
</style>
</head>

<body>

<div class="container">

    <h1>🌈 今天北部去哪玩？</h1>

    <p class="subtitle">
        旅行選擇障礙？讓幸運抽籤幫你決定！
    </p>

    <label for="options">📍 請輸入想去的景點（一行一個）：</label>

    <textarea id="options">鼻頭角
陽明山
烏來
九份
淡水</textarea>

    <button onclick="drawLottery()">
        🎲 幫我挑挑！
    </button>

    <div class="result-box">
        <div class="result-title">✨ 今日幸運景點 ✨</div>
        <div id="result">等你來抽籤！</div>
        <div id="message"></div>
    </div>

    <div class="footer">
        每個景點機率相同，今天就出發吧！🚗
    </div>

</div>

<script>
    function drawLottery() {

        // 取得輸入的內容
        const input = document.getElementById("options").value;

        // 依照換行拆分，去除空白行及重複選項
        const options = [...new Set(
            input.split("\n")
                .map(item => item.trim())
                .filter(item => item !== "")
        )];

        const result = document.getElementById("result");
        const message = document.getElementById("message");

        // 清單為空時顯示提示
        if (options.length === 0) {
            result.textContent = "🤔";
            message.textContent = "請先輸入至少一個選項";
            return;
        }

        // 隨機抽取一個選項，每個選項機率相同
        const randomIndex = Math.floor(
            Math.random() * options.length
        );

        // 顯示抽籤結果
        result.textContent = options[randomIndex];
        message.textContent = "🎉 恭喜！今天就決定去這裡！";
    }
</script>

</body>
</html>
